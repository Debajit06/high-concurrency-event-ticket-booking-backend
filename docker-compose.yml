services:
  postgres:
    image: postgres:16
    container_name: event_booking_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: event_booking
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: event_booking_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
